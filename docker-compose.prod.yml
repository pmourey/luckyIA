version: '3.8'

services:
  web:
    build:
      context: .
      args:
        INSTALL_TORCH: "false"
    image: luckyia:prod
    environment:
      - FLASK_APP=web_app/app.py
      - FLASK_ENV=production
    volumes:
      - ./:/app:ro
    networks:
      - webnet
    expose:
      - "8000"
    command: ["gunicorn", "-b", "0.0.0.0:8000", "web_app.app:app", "--workers", "3"]

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - webnet

networks:
  webnet:
    driver: bridge

